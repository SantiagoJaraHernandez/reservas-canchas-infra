services:
  postgres:
    image: postgres:15
    container_name: reservas-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservasdb_dev
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas123
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - reservas-dev-net

  mongodb:
    image: mongo:7
    container_name: reservas-dev-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: authdb_dev
    ports:
      - "27018:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - reservas-dev-net

volumes:
  postgres_dev_data:
  mongodb_dev_data:

networks:
  reservas-dev-net:
    name: reservas-dev-net
    driver: bridge
